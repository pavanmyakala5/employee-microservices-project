spring.application.name=api-gateway

server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Department Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=department-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://DEPARTMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/departments/**